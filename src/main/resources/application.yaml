spring:
  application:
    name: task-scheduling
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/taskdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:taskuser}
    password: ${DB_PASSWORD:taskpass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

app:
  scheduler:
    poll-interval-ms: ${SCHEDULER_POLL_INTERVAL_MS:1000}
    batch-size: ${SCHEDULER_BATCH_SIZE:100}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    max-backoff-seconds: ${OUTBOX_MAX_BACKOFF_SECONDS:300}
  redis-cache:
    enabled: ${REDIS_CACHE_ENABLED:false}
    ttl-seconds: ${REDIS_CACHE_TTL_SECONDS:300}

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:localhost:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:task-scheduling-producer}
  topic: ${ROCKETMQ_TOPIC:task-schedule-topic}